<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>AE2 Cinematic Interactions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121633"/>
      <stop offset="1" stop-color="#2a1b52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3fd4ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3fd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6172"/>
      <stop offset="1" stop-color="#383d4a"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde6"/>
      <stop offset="1" stop-color="#9aa1b0"/>
    </linearGradient>
    <linearGradient id="fluix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d8ff"/>
      <stop offset="0.5" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#4b2a9e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

    <!-- letterbox film bars -->
    <g fill="#07080f">
      <rect y="0" width="512" height="70"/>
      <rect y="442" width="512" height="70"/>
    </g>
    <g fill="#ffffff" opacity="0.16">
      <rect x="30" y="24" width="26" height="22" rx="5"/><rect x="86" y="24" width="26" height="22" rx="5"/>
      <rect x="142" y="24" width="26" height="22" rx="5"/><rect x="198" y="24" width="26" height="22" rx="5"/>
      <rect x="254" y="24" width="26" height="22" rx="5"/><rect x="310" y="24" width="26" height="22" rx="5"/>
      <rect x="366" y="24" width="26" height="22" rx="5"/><rect x="422" y="24" width="26" height="22" rx="5"/>
      <rect x="478" y="24" width="26" height="22" rx="5"/>
      <rect x="30" y="466" width="26" height="22" rx="5"/><rect x="86" y="466" width="26" height="22" rx="5"/>
      <rect x="142" y="466" width="26" height="22" rx="5"/><rect x="198" y="466" width="26" height="22" rx="5"/>
      <rect x="254" y="466" width="26" height="22" rx="5"/><rect x="310" y="466" width="26" height="22" rx="5"/>
      <rect x="366" y="466" width="26" height="22" rx="5"/><rect x="422" y="466" width="26" height="22" rx="5"/>
      <rect x="478" y="466" width="26" height="22" rx="5"/>
    </g>

    <!-- ME Drive -->
    <rect x="106" y="104" width="220" height="304" rx="14" fill="#1a1d25"/>
    <rect x="112" y="108" width="208" height="292" rx="10" fill="url(#body)"/>
    <rect x="112" y="108" width="208" height="6" rx="3" fill="#7d8597"/>
    <rect x="128" y="126" width="176" height="258" rx="6" fill="#20232b"/>

    <!-- bays: 2 columns x 5 rows -->
    <g>
      <rect x="138" y="138" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="220" y="138" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="138" y="186" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="220" y="186" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="138" y="234" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="220" y="234" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="138" y="282" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="220" y="282" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="138" y="330" width="74" height="36" rx="4" fill="#0f1116"/>
      <rect x="220" y="330" width="74" height="36" rx="4" fill="#0f1116"/>
    </g>
    <!-- cells (the one at row 3, right column is being pulled out) -->
    <g>
      <rect x="142" y="142" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="146" y="148" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="198" cy="156" r="5" fill="#45f08a"/>
      <rect x="224" y="142" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="228" y="148" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="280" cy="156" r="5" fill="#45f08a"/>
      <rect x="142" y="190" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="146" y="196" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="198" cy="204" r="5" fill="#3fd4ff"/>
      <rect x="224" y="190" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="228" y="196" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="280" cy="204" r="5" fill="#ffb13b"/>
      <rect x="142" y="238" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="146" y="244" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="198" cy="252" r="5" fill="#45f08a"/>
      <rect x="142" y="286" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="146" y="292" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="198" cy="300" r="5" fill="#3fd4ff"/>
      <rect x="224" y="286" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="228" y="292" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="280" cy="300" r="5" fill="#45f08a"/>
      <rect x="224" y="334" width="66" height="28" rx="3" fill="url(#cell)"/><rect x="228" y="340" width="40" height="16" rx="2" fill="#3c4250"/><circle cx="280" cy="348" r="5" fill="#ff5a5a"/>
    </g>
    <!-- the empty bay glows where the cell left -->
    <rect x="222" y="236" width="70" height="32" rx="3" fill="#3fd4ff" opacity="0.18"/>

    <!-- motion streaks from the bay to the pulled cell -->
    <g stroke="#3fd4ff" stroke-linecap="round" opacity="0.7">
      <line x1="296" y1="244" x2="336" y2="236" stroke-width="5"/>
      <line x1="296" y1="256" x2="344" y2="252" stroke-width="4" opacity="0.7"/>
      <line x1="296" y1="266" x2="330" y2="268" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- the pulled-out cell, closer to the camera -->
    <g transform="translate(372 250) rotate(-10)">
      <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#3fd4ff" opacity="0.45" filter="url(#soft)"/>
      <rect x="-66" y="-27" width="132" height="54" rx="6" fill="#1a1d25"/>
      <rect x="-62" y="-23" width="124" height="46" rx="4" fill="url(#cell)"/>
      <rect x="-54" y="-14" width="74" height="28" rx="3" fill="#3c4250"/>
      <!-- fluix crystal on the cell label -->
      <path d="M -17 -11 L -6 0 L -17 11 L -28 0 Z" fill="url(#fluix)"/>
      <circle cx="44" cy="0" r="9" fill="#3fd4ff"/>
      <circle cx="44" cy="0" r="4" fill="#e9fbff"/>
    </g>

    <!-- camera focus brackets around the pulled cell -->
    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 288 196 L 288 180 L 306 180"/>
      <path d="M 444 180 L 462 180 L 462 196"/>
      <path d="M 288 304 L 288 320 L 306 320"/>
      <path d="M 444 320 L 462 320 L 462 304"/>
    </g>
    <circle cx="452" cy="88" r="0" fill="none"/>
  </g>
</svg>
